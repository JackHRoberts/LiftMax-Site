<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A LiftMax routine</title>
<meta name="description" content="A routine shared from LiftMax.">
<meta name="theme-color" content="#0B0D0E">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png">

<!-- Where a shared routine link lands when LiftMax isn't installed, or when the
     tapping app's own browser keeps the link instead of opening the app (Instagram's
     often does). The routine is in the link after the '#', which the browser never
     sends to this server: it is decoded here, on the phone, and nothing is stored.

     Same format as the app's src/lib/routineLink.ts — #2.<name>~<slot>…, or the older
     #1.<base64url JSON> —
     and read the same way: a version newer than this page knows says so, anything
     else that doesn't parse is "not a LiftMax routine". Change one, change both. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .routine { list-style: none; margin: 1.5rem 0 2rem; padding: 0; }
  .routine li {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.75rem 0; border-bottom: 1px solid var(--border);
  }
  .routine .plan { color: var(--text-secondary); white-space: nowrap; }
  .open-app {
    display: inline-block; margin: 0.5rem 0 1.5rem; padding: 0.9rem 1.4rem;
    border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font-weight: 600; text-decoration: none;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="wordmark" href="/">Lift<span>Max</span></a>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1 id="title">A LiftMax routine</h1>
    <p id="lede">Someone shared a routine with you. Add it in LiftMax and it is priced from your
      own training: the sets and reps are theirs, the weights are yours.</p>
    <ul class="routine" id="routine" hidden></ul>
    <a class="open-app" id="open" hidden>Open in LiftMax</a>
    <p class="hero-note" id="after">No LiftMax yet? Get it below, then come back and tap the link
      again to add the routine.</p>
    <div class="get">
      <a class="store store-play" href="https://play.google.com/store/apps/details?id=com.liftmax.android">
        <img src="/badges/google-play.png" alt="Get it on Google Play" width="646" height="250">
      </a>
      <a class="store store-apple" href="https://apps.apple.com/app/liftmax/id6809827285">
        <img src="/badges/app-store.svg" alt="Download on the App Store" width="120" height="40">
      </a>
    </div>
  </div>
</main>

<script>
(function () {
  var VERSION = 2;

  // Version 2's codes: positions in the app's src/lib/routineLinkCodes.ts,
  // which is append-only. Change one, change both. A custom exercise's muscle
  // and equipment codes are not read here; only its name and plan are shown.
  var EXERCISES = ["Barbell Bench Press", "Barbell Incline Bench Press", "Barbell Decline Bench Press", "Dumbbell Bench Press", "Dumbbell Incline Bench Press", "Dumbbell Decline Bench Press", "Barbell Floor Press", "Dumbbell Floor Press", "Dumbbell Fly", "Dumbbell Pullover", "Incline Dumbbell Fly", "Cable Fly", "High-to-Low Cable Fly", "Low-to-High Cable Fly", "Cable Chest Press", "Pec Deck Machine", "Chest Press Machine", "Incline Chest Press Machine", "Decline Chest Press Machine", "Smith Machine Bench Press", "Smith Machine Incline Bench Press", "Push-Up", "Incline Push-Up", "Decline Push-Up", "Chest Dip", "Conventional Deadlift", "Sumo Deadlift", "Trap Bar Deadlift", "Deficit Deadlift", "Rack Pull", "Barbell Row", "Underhand Barbell Row", "Pendlay Row", "Seal Row", "T-Bar Row", "Meadows Row", "Chest-Supported Row Machine", "Machine Row", "T-Bar Row Machine", "Close Grip Seated Cable Row", "Wide Grip Seated Cable Row", "Single-Arm Cable Row", "Single-Arm Dumbbell Row", "Chest-Supported Dumbbell Row", "Kettlebell Single-Arm Row", "Inverted Row", "Pull-Up", "Chin-Up", "Neutral-Grip Pull-Up", "Lat Pulldown", "Close-Grip Lat Pulldown", "Wide-Grip Lat Pulldown", "Neutral-Grip Lat Pulldown", "Straight-Arm Pulldown", "Cable Pullover", "Machine Pullover", "Back Extension", "Reverse Hyperextension", "Barbell Back Squat", "Barbell Front Squat", "Barbell Box Squat", "Barbell Pause Squat", "Barbell Walking Lunge", "Smith Machine Squat", "Leg Press", "Single-Leg Leg Press", "Hack Squat Machine", "Belt Squat Machine", "Leg Extension Machine", "Bulgarian Split Squat", "Dumbbell Walking Lunge", "Dumbbell Reverse Lunge", "Dumbbell Step-Up", "Goblet Squat", "Kettlebell Front Squat", "Sissy Squat", "Wall Sit", "Barbell Romanian Deadlift", "Barbell Stiff-Leg Deadlift", "Good Morning", "Smith Machine Romanian Deadlift", "Dumbbell Romanian Deadlift", "Single-Leg Romanian Deadlift", "Kettlebell Romanian Deadlift", "Seated Leg Curl Machine", "Lying Leg Curl Machine", "Standing Leg Curl Machine", "Glute Ham Raise", "Nordic Hamstring Curl", "Single-Leg Glute Bridge", "Slider Hamstring Curl", "Bodyweight Single-Leg Romanian Deadlift", "Barbell Hip Thrust", "Barbell Glute Bridge", "Smith Machine Hip Thrust", "Dumbbell Hip Thrust", "Machine Hip Thrust", "Cable Pull-Through", "Cable Glute Kickback", "Glute Kickback Machine", "Hip Abduction Machine", "Hip Adduction Machine", "Cable Hip Abduction", "Kettlebell Swing", "Glute Bridge", "Single-Leg Hip Thrust", "Overhead Press", "Seated Barbell Overhead Press", "Barbell Push Press", "Landmine Press", "Barbell Upright Row", "Smith Machine Overhead Press", "Dumbbell Shoulder Press", "Single-Arm Dumbbell Shoulder Press", "Arnold Press", "Dumbbell Lateral Raise", "Dumbbell Front Raise", "Dumbbell Upright Row", "Dumbbell Rear Delt Fly", "Seated Machine Shoulder Press", "Machine Lateral Raise", "Reverse Pec Deck", "Cable Lateral Raise", "Cable Front Raise", "Cable Upright Row", "Cable Face Pull", "Cable Rear Delt Fly", "Kettlebell Shoulder Press", "Barbell Shrug", "Trap Bar Shrug", "Dumbbell Shrug", "Cable Shrug", "Smith Machine Shrug", "Machine Shrug", "Prone Dumbbell Y-Raise", "Barbell Curl", "Barbell Preacher Curl", "EZ-Bar Curl", "EZ-Bar Preacher Curl", "EZ-Bar Reverse Curl", "Dumbbell Bicep Curl", "Dumbbell Hammer Curl", "Cross-Body Hammer Curl", "Dumbbell Zottman Curl", "Dumbbell Incline Curl", "Dumbbell Spider Curl", "Dumbbell Preacher Curl", "Dumbbell Concentration Curl", "Cable Curl", "Cable Rope Hammer Curl", "Machine Bicep Curl", "Barbell Close-Grip Bench Press", "Smith Machine Close-Grip Bench Press", "EZ-Bar Skull Crusher", "Dumbbell Skull Crusher", "Dumbbell Overhead Triceps Extension", "Dumbbell Triceps Kickback", "Cable Triceps Pushdown", "Cable Rope Triceps Pushdown", "Cable Overhead Triceps Extension", "Cable Triceps Kickback", "Machine Triceps Extension", "Machine Dip", "Triceps Dip", "Bench Dip", "Diamond Push-Up", "Barbell Wrist Curl", "Barbell Reverse Wrist Curl", "Dumbbell Wrist Curl", "Dumbbell Reverse Wrist Curl", "Farmer's Carry", "Kettlebell Farmer's Carry", "Barbell Static Hold", "Dead Hang", "Standing Calf Raise Machine", "Seated Calf Raise Machine", "Leg Press Calf Raise", "Donkey Calf Raise Machine", "Smith Machine Calf Raise", "Barbell Calf Raise", "Dumbbell Calf Raise", "Seated Dumbbell Calf Raise", "Single-Leg Calf Raise", "Cable Crunch", "Cable Woodchopper", "Cable Pallof Press", "Machine Crunch", "Hanging Leg Raise", "Hanging Knee Raise", "Lying Leg Raise", "Reverse Crunch", "Ab Wheel Rollout", "Decline Sit-Up", "Bicycle Crunch", "Dead Bug", "Plank", "Side Plank", "Hollow Body Hold", "Weighted Sit-Up", "Dumbbell Side Bend", "Dumbbell Suitcase Carry", "Kettlebell Russian Twist", "Barbell Power Clean", "Barbell Clean", "Barbell Hang Clean", "Barbell Snatch", "Barbell Power Snatch", "Barbell Push Jerk", "Barbell Thruster", "Dumbbell Thruster", "Kettlebell Goblet Thruster", "Kettlebell Clean and Press", "Kettlebell Snatch", "Kettlebell Turkish Get-Up", "Burpee", "Rowing Machine", "Ski Erg", "Stationary Bike", "Treadmill Run", "Treadmill Incline Walk", "Elliptical", "Stair Climber", "Sled Push", "Battle Ropes", "Jump Rope", "Outdoor Run", "Brisk Walk"];
  var hash = location.hash.slice(1);
  var title = document.getElementById('title');
  var lede = document.getElementById('lede');

  function fail(newer) {
    title.textContent = newer ? 'Open this in the LiftMax app' : "This link isn't a LiftMax routine";
    lede.textContent = newer
      ? 'It was shared from a newer version of LiftMax than this page knows. Open it in the app.'
      : 'It may have been cut short when it was copied. Ask for the link again.';
  }

  function decodeName(text) {
    return decodeURIComponent(text.replace(/_/g, '%20'));
  }

  // Version 2 into version 1's shape: { n, e: [{ x, s, r, d }] }.
  function decodeV2(text) {
    var parts = text.split('~');
    if (parts.length < 2) throw new Error('no slots');
    return {
      n: decodeName(parts[0]),
      e: parts.slice(1).map(function (part) {
        var f = part.split('.');
        var x;
        if (f[0].charAt(0) === '!' || f[0].charAt(0) === '-') x = decodeName(f[0].slice(1));
        else x = EXERCISES[parseInt(f[0], 36)];
        if (typeof x !== 'string') throw new Error('unknown exercise');
        return { x: x, s: Number(f[1]), r: Number(f[2]) || 0, d: Number(f[3]) || 0 };
      })
    };
  }

  function decode(text) {
    var b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function time(seconds) {
    if (seconds < 60) return seconds + 's';
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return s ? m + 'm ' + s + 's' : m + 'm';
  }

  var dot = hash.indexOf('.');
  var version = dot > 0 ? Number(hash.slice(0, dot)) : NaN;
  if (!(version >= 1)) return fail(false);
  if (version > VERSION) return fail(true);

  var routine;
  try {
    routine = version === 1 ? decode(hash.slice(dot + 1)) : decodeV2(hash.slice(dot + 1));
  } catch (e) { return fail(false); }
  if (!routine || typeof routine.n !== 'string' || !Array.isArray(routine.e) || !routine.e.length) {
    return fail(false);
  }

  title.textContent = routine.n;
  var list = document.getElementById('routine');
  routine.e.forEach(function (slot) {
    if (!slot || typeof slot.x !== 'string') return;
    var li = document.createElement('li');
    var name = document.createElement('span');
    name.textContent = slot.x;
    var plan = document.createElement('span');
    plan.className = 'plan';
    var work = slot.r ? String(slot.r) : time(slot.d || 0);
    plan.textContent = slot.s > 1 || slot.r ? slot.s + ' × ' + work : work;
    li.appendChild(name);
    li.appendChild(plan);
    list.appendChild(li);
  });
  list.hidden = false;

  // For an app's own browser that kept the link rather than opening LiftMax.
  var open = document.getElementById('open');
  open.href = 'liftmax://r#' + hash;
  open.hidden = false;
})();
</script>

</body>
</html>
